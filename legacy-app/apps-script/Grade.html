<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학년부장 출결 현황</title>
  <style>
    :root {
      --primary:#1a73e8;
      --bg:#f8f9fa;
      --card:#ffffff;
      --border:#dadce0;
      --muted:#5f6368;
      --danger:#c5221f;
      --danger-bg:#fce8e6;
      --success:#137333;
      --success-bg:#e6f4ea;
      --warn:#b06000;
      --warn-bg:#fef7e0;
    }

    body {
      font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
      background:var(--bg);
      margin:0;
      padding:16px;
      color:#202124;
    }

    .container {
      max-width:960px;
      margin:0 auto;
    }

    .header {
      text-align:center;
      margin-bottom:16px;
    }

    .header h1 {
      margin:0;
      font-size:23px;
      color:var(--primary);
    }

    .header p {
      margin:6px 0 0 0;
      color:var(--muted);
      font-size:13px;
    }

    .filter-card, .card {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      padding:16px;
      margin-bottom:16px;
      box-shadow:0 1px 3px rgba(0,0,0,.05);
    }

    input, button {
      width:100%;
      box-sizing:border-box;
      padding:12px;
      font-size:16px;
      border-radius:10px;
      border:1px solid var(--border);
    }

    button {
      margin-top:8px;
      border:0;
      background:var(--primary);
      color:white;
      font-weight:bold;
    }

    .top-stats {
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:10px;
    }

    .stat {
      background:#f1f3f4;
      border-radius:12px;
      padding:14px;
      text-align:center;
    }

    .stat .num {
      font-size:24px;
      font-weight:bold;
      margin-bottom:4px;
    }

    .stat .label {
      color:var(--muted);
      font-size:13px;
    }

    .periods {
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:10px;
    }

    .period {
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px;
      background:#fff;
    }

    .period-title {
      font-weight:bold;
      margin-bottom:8px;
      font-size:17px;
    }

    .badges {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }

    .badge {
      padding:4px 7px;
      font-size:12px;
      border-radius:999px;
      font-weight:bold;
    }

    .b-apply { background:#e8f0fe; color:#1a73e8; }
    .b-absent { background:var(--danger-bg); color:var(--danger); }
    .b-ok { background:var(--success-bg); color:var(--success); }
    .b-warn { background:var(--warn-bg); color:var(--warn); }

    .class-card {
      background:#fff;
      border:1px solid var(--border);
      border-radius:14px;
      margin-bottom:12px;
      overflow:hidden;
    }

    .class-header {
      background:#f1f3f4;
      padding:12px 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:bold;
    }

    .class-body {
      padding:10px 14px;
    }

    .student {
      padding:9px 0;
      border-bottom:1px solid #f1f3f4;
      display:flex;
      justify-content:space-between;
      gap:10px;
    }

    .student:last-child {
      border-bottom:0;
    }

    .student-main {
      font-weight:bold;
    }

    .student-sub {
      color:var(--muted);
      font-size:12px;
      margin-top:2px;
    }

    .status {
      font-size:12px;
      padding:4px 8px;
      border-radius:999px;
      white-space:nowrap;
      font-weight:bold;
      align-self:center;
    }

    .status-ok {
      background:var(--success-bg);
      color:var(--success);
    }

    .status-no {
      background:var(--danger-bg);
      color:var(--danger);
    }

    .empty {
      color:var(--muted);
      padding:12px 0;
      text-align:center;
    }

    .loading {
      text-align:center;
      padding:40px;
      color:var(--muted);
    }

    @media (max-width:720px) {
      .top-stats { grid-template-columns:repeat(2, 1fr); }
      .periods { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>학년부장 야자 출결 현황</h1>
      <p>전체 반의 결석 및 담임 확인 현황을 조회합니다.</p>
    </div>

    <div class="filter-card">
      <input type="date" id="dateInput">
      <button onclick="loadGrade()">조회</button>
    </div>

    <div id="content"></div>
  </div>

  <script>
    window.onload = function() {
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      document.getElementById('dateInput').value = `${y}-${m}-${d}`;
      loadGrade();
    };

    function loadGrade() {
      const date = document.getElementById('dateInput').value;
      if (!date) return;

      document.getElementById('content').innerHTML =
        '<div class="loading">학년 전체 출결 현황을 불러오는 중입니다...</div>';

      google.script.run
        .withSuccessHandler(renderGrade)
        .getGradeDailySummary(date);
    }

    function renderGrade(data) {
      const area = document.getElementById('content');

      const periodHtml = Object.values(data.periods).map(p => `
        <div class="period">
          <div class="period-title">${p.period}</div>
          <div class="badges">
            <span class="badge b-apply">신청 ${p.applicantCount}</span>
            <span class="badge b-absent">결석 ${p.absenceCount}</span>
            <span class="badge b-ok">확인 ${p.approvedCount}</span>
            <span class="badge b-warn">미확인 ${p.unconfirmedCount}</span>
          </div>
        </div>
      `).join('');

      const classHtml = Object.values(data.classes).map(c => {
        const students = c.absences;

        const studentHtml = students.length === 0
          ? '<div class="empty">결석자 없음</div>'
          : students.map(s => {
              const ok = s.approved;
              const statusText = ok ? `확인완료${s.reason ? ' - ' + s.reason : ''}` : '미확인';
              return `
                <div class="student">
                  <div>
                    <div class="student-main">${s.studentId} ${s.name}</div>
                    <div class="student-sub">${s.period} / ${s.type}</div>
                  </div>
                  <div class="status ${ok ? 'status-ok' : 'status-no'}">${statusText}</div>
                </div>
              `;
            }).join('');

        return `
          <div class="class-card">
            <div class="class-header">
              <span>${c.className}</span>
              <span>
                신청 ${c.applicantCount} / 결석 ${c.absenceCount} /
                확인 ${c.approvedCount} / 미확인 ${c.unconfirmedCount}
              </span>
            </div>
            <div class="class-body">
              ${studentHtml}
            </div>
          </div>
        `;
      }).join('');

      area.innerHTML = `
        <div class="card">
          <div class="top-stats">
            <div class="stat">
              <div class="num">${data.totalApplicant}</div>
              <div class="label">전체 신청</div>
            </div>
            <div class="stat">
              <div class="num">${data.totalAbsent}</div>
              <div class="label">전체 결석</div>
            </div>
            <div class="stat">
              <div class="num">${data.totalApproved}</div>
              <div class="label">확인 완료</div>
            </div>
            <div class="stat">
              <div class="num">${data.totalUnconfirmed}</div>
              <div class="label">미확인</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>타임별 현황</h3>
          <div class="periods">${periodHtml}</div>
        </div>

        <div class="card">
          <h3>반별 결석 현황</h3>
          ${classHtml}
        </div>
      `;
    }
  </script>
</body>
</html>
