<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 24px;
    }

    .box {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .15);
      text-align: center;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      box-sizing: border-box;
      margin: 8px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      border: 0;
      border-radius: 12px;
      margin-top: 10px;
    }

    .primary {
      background: #1a73e8;
      color: white;
    }

    .primary:disabled {
      background: #9fc1f5;
    }

    .secondary {
      background: #ddd;
      color: #222;
    }

    .msg {
      margin-top: 18px;
      font-size: 18px;
      white-space: pre-line;
    }

    .msg.error {
      color: #c5221f;
    }

    .msg.success {
      color: #137333;
    }

    .small {
      margin-top: 16px;
      color: #777;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2 onclick="teacherResetClick()">운호고 야자출결</h2>

    <div id="registerArea">
      <p>처음 한 번만 학번을 저장하세요.</p>
      <input id="studentIdInput" type="number" placeholder="학번 예: 1101">
      <button class="primary" onclick="saveStudentId()">내 학번 저장</button>
    </div>

    <div id="mainArea" class="hidden">
      <p>저장된 학번</p>
      <h2 id="savedStudentId"></h2>

      <button id="attendBtn" class="primary" onclick="submitAttendance()">출석하기</button>
    </div>

    <div class="msg" id="message"></div>
    <div class="small">출석하기는 실제 입실했을 때만 누르세요.</div>
  </div>

  <script>
    window.onload = function() {
      const saved = localStorage.getItem('studentId');
      if (saved) showMain(saved);
    };

    function saveStudentId() {
      const id = document.getElementById('studentIdInput').value.trim();
      if (!id) {
        alert('학번을 입력하세요.');
        return;
      }

      localStorage.setItem('studentId', id);
      showMain(id);
    }

    function showMain(id) {
      document.getElementById('registerArea').style.display = 'none';
      document.getElementById('mainArea').classList.remove('hidden');
      document.getElementById('savedStudentId').innerText = id;
      setMessage('', '');
    }

    function setMessage(text, type) {
      const el = document.getElementById('message');
      el.innerText = text;
      el.className = 'msg' + (type ? ' ' + type : '');
    }

    function submitAttendance() {
      const id = localStorage.getItem('studentId');

      if (!id) {
        alert('학번을 먼저 저장하세요.');
        return;
      }

      const btn = document.getElementById('attendBtn');
      btn.disabled = true;
      setMessage('출석 기록 전송 중...', '');

      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false;
          if (!result.success) {
            setMessage('출석 불가\n' + result.message, 'error');
            return;
          }
          setMessage(
            '✅ ' + result.status + ' 완료\n' + result.name + ' (' + result.className + ')\n' +
            result.slotName + ' · ' + result.time,
            'success'
          );
        })
        .withFailureHandler(function(error) {
          // ⚠️ 예전 버전의 버그 재발 방지: 전송이 실패하면 반드시 화면에 보이게 표시한다
          // (조용히 실패해서 "분명 눌렀는데 기록이 안 남는" 문제의 원인이었다).
          btn.disabled = false;
          setMessage('⚠️ 전송 오류가 발생했습니다.\n다시 시도해주세요.\n(' + error.message + ')', 'error');
        })
        .submitWebAttendance(id);
    }

    function teacherResetClick() {
      const pw = prompt('교사 비밀번호');
      if (pw === null) return;

      google.script.run
        .withSuccessHandler(function(ok) {
          if (!ok) {
            alert('비밀번호 오류');
            return;
          }

          localStorage.removeItem('studentId');
          alert('학번이 초기화되었습니다.');
          location.reload();
        })
        .withFailureHandler(function(error) {
          alert('오류: ' + error.message);
        })
        .checkTeacherPassword(pw);
    }
  </script>
</body>

</html>
